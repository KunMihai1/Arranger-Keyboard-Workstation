<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in and sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#c8cacd}a:hover{color:#ffffff}
.silk{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd;white-space:nowrap}
.silk-dim{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;color:#a3a5aa}
.rule{height:1px;background:#4a4c51}
.seg{height:30px;padding:0 14px;border:1px solid #111214;background:linear-gradient(#3d3e42,#2c2d30);color:#c8cacd;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg-lit{background:linear-gradient(#56463a,#3f3127);color:#ffe2cf;border-color:#2a1d14}
.led{width:6px;height:6px;border-radius:50%;background:#4a2a24}
.led-grn{background:#5fd35a;box-shadow:0 0 4px rgba(95,211,90,.7)}
.input{width:100%;height:30px;box-sizing:border-box;padding:0 10px;border:none;border-radius:2px;outline:none;background:#a7b394;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);font-family:'Share Tech Mono',monospace;font-size:15px;color:#1b2216}
.input::placeholder{color:#4d5a40}
.input:focus{box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 0 0 2px #e0b25a}
.check{display:flex;align-items:center;gap:8px;height:26px;padding:0;background:none;border:none;cursor:pointer;text-align:left}
.link{background:none;border:none;padding:0;cursor:pointer;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;color:#e0b25a;text-decoration:underline}
.led-on{background:#ff5a36;box-shadow:0 0 4px rgba(255,90,54,.7)}
.label{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd}
</style>
</helmet>
<div style="width:1200px;height:365px;box-sizing:border-box;padding:22px 28px;display:flex;gap:60px;align-items:center;justify-content:center;background:linear-gradient(#26272a,#212225)">
  <div style="width:300px;display:flex;flex-direction:column;gap:10px">
    <span class="silk" style="font-size:22px;letter-spacing:.24em;white-space:normal;line-height:1.3">Arranger Workstation</span>
    <div class="rule"></div>
    <span class="silk-dim">{{subtitle}}</span>
  </div>
  <form style="width:400px;display:flex;flex-direction:column;gap:9px" onSubmit="{{submit}}">
    <sc-if value="{{signup}}" hint-placeholder-val="{{false}}">
      <label class="label" for="username">Username</label>
      <input class="input" id="username" placeholder="Enter username…" autocomplete="username">
    </sc-if>
    <label class="label" for="email">Email</label>
    <input class="input" id="email" type="email" placeholder="Enter email…" autocomplete="email" value="{{email}}" onChange="{{typedEmail}}">
    <sc-if value="{{showRemembered}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;align-items:center;gap:8px;margin-top:-3px"><span class="silk-dim">Remembered from last time.</span><button type="button" class="link" onClick="{{forget}}">Not you?</button></div>
    </sc-if>
    <label class="label" for="password">Password</label>
    <div style="display:flex;gap:6px">
      <input class="input" id="password" type="{{passwordType}}" placeholder="Enter password…" autocomplete="current-password">
      <button type="button" class="seg" style="width:74px" onClick="{{toggleShow}}" aria-label="Show or hide the password">{{showLabel}}</button>
    </div>
    <button type="button" class="check" role="checkbox" aria-checked="{{rememberChecked}}" onClick="{{toggleRemember}}"><span class="{{rememberLed}}" aria-hidden="true"></span><span class="label">Remember me</span><span class="silk-dim">· stay signed in until you log out</span></button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button type="submit" class="seg seg-lit" style="flex-grow:1"><span class="led led-grn" aria-hidden="true"></span>{{primary}}</button>
      <button type="button" class="seg" onClick="{{switchMode}}">{{secondary}}</button>
      <sc-if value="{{login}}" hint-placeholder-val="{{true}}"><button type="button" class="seg">Forgot password?</button></sc-if>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":365}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.state || {};
    const signup = state.mode === 'signup';
    const show = !!state.show;
    const remember = state.remember ?? true;
    const email = state.email ?? 'player@example.com';
    return {
      email, rememberChecked: remember ? 'true' : 'false',
      rememberLed: remember ? 'led led-on' : 'led',
      showRemembered: !signup && email === 'player@example.com',
      typedEmail: (event) => this.setState({ email: event.target.value }),
      toggleRemember: () => this.setState({ remember: !remember }),
      forget: () => this.setState({ email: '' }),
      signup, login: !signup,
      subtitle: signup ? 'Create an account to start playing.' : 'Welcome back. Log in to start playing.',
      primary: signup ? 'Create account' : 'Log in',
      secondary: signup ? 'Back to log in' : 'Sign up',
      passwordType: show ? 'text' : 'password',
      showLabel: show ? 'Hide' : 'Show',
      toggleShow: () => this.setState({ show: !show }),
      switchMode: () => this.setState({ mode: signup ? 'login' : 'signup' }),
      submit: (event) => { event.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
