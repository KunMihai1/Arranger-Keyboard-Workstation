<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord helper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#c8cacd}a:hover{color:#ffffff}
.silk{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd;white-space:nowrap}
.silk-dim{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a3a5aa;white-space:nowrap}
.rule{height:1px;background:#4a4c51}
.seg{height:22px;padding:0 10px;border:1px solid #111214;background:linear-gradient(#3d3e42,#2c2d30);color:#c8cacd;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lcd{background:#a7b394;border-radius:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);font-family:'Share Tech Mono',monospace;color:#1b2216}
.search{width:100%;height:26px;box-sizing:border-box;padding:0 10px;border:none;outline:none;font-family:'Share Tech Mono',monospace;font-size:14px;color:#1b2216}
.search::placeholder{color:#4d5a40}
.crow{display:flex;justify-content:space-between;width:100%;height:23px;padding:0 10px;box-sizing:border-box;border:none;background:none;font-family:'Share Tech Mono',monospace;font-size:14px;color:#1b2216;cursor:pointer;text-align:left}
.crow-sel{background:#1b2216;color:#a7b394}
.mini{position:relative;height:62px;background:#0b0b0c;border-radius:2px;overflow:hidden}
.mw{position:absolute;top:0;width:11px;height:62px;background:#f6f4ee;box-shadow:inset -1px 0 0 rgba(0,0,0,.18)}
.mw-on{background:#e4a33a}
.mb{position:absolute;top:0;width:7px;height:38px;background:#1a1a1c}
.mb-on{background:#c27d14}
</style>
</helmet>
<div style="width:1200px;height:365px;box-sizing:border-box;padding:16px 28px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#26272a,#212225)">
  <div style="display:flex;align-items:center;gap:12px">
    <span class="silk" style="font-size:14px;letter-spacing:.2em">Chord helper</span>
    <div class="rule" style="flex-grow:1"></div>
    <button class="seg" aria-label="Close chord helper" onClick="{{close}}">Exit</button>
  </div>
  <div style="display:flex;gap:22px;flex-grow:1;min-height:0">
    <div style="width:280px;display:flex;flex-direction:column;gap:6px;min-height:0">
      <div class="lcd" style="padding:0"><input class="search lcd" placeholder="Search chords…" aria-label="Search chords" value="{{query}}" onChange="{{typed}}"></div>
      <div class="lcd" style="flex-grow:1;padding:4px 0;overflow-y:auto;min-height:0">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10"><button class="{{r.cls}}" onClick="{{r.pick}}" aria-label="{{r.name}}"><span>{{r.name}}</span><span>{{r.notes}}</span></button></sc-for>
      </div>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-family:'Share Tech Mono',monospace;font-size:34px;color:#e9e6de">{{chordName}}</span>
        <span class="silk-dim" style="font-size:12px">{{chordNotes}}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px">
        <sc-for list="{{voicings}}" as="v" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:center;gap:8px"><span class="silk">{{v.title}}</span><div class="rule" style="flex-grow:1"></div></div>
            <div class="mini" aria-label="{{v.title}} keys" role="img">
              <sc-for list="{{v.whites}}" as="w" hint-placeholder-count="21"><span class="{{w.cls}}" style="left:{{w.left}}px"></span></sc-for>
              <sc-for list="{{v.blacks}}" as="b" hint-placeholder-count="15"><span class="{{b.cls}}" style="left:{{b.left}}px"></span></sc-for>
            </div>
            <span class="silk-dim" style="font-family:'Share Tech Mono',monospace;letter-spacing:0;font-size:12px">{{v.notes}}</span>
          </div>
        </sc-for>
      </div>
      <span class="silk-dim" style="margin-top:4px">Click a chord to see it · the keys show where to put your fingers</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":1200,"height":365}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.state || {};
    const names = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
    const types = [['', [0, 4, 7]], ['m', [0, 3, 7]], ['7', [0, 4, 7, 10]], ['maj7', [0, 4, 7, 11]], ['m7', [0, 3, 7, 10]], ['sus4', [0, 5, 7]], ['dim', [0, 3, 6]], ['aug', [0, 4, 8]], ['6', [0, 4, 7, 9]]];
    const all = [];
    names.forEach((root, rootIndex) => types.forEach(([suffix, intervals]) => all.push({ name: root + suffix, root: rootIndex, intervals })));
    const query = (state.query || '').trim().toLowerCase();
    const filtered = all.filter((chord) => !query || chord.name.toLowerCase().startsWith(query));
    const chosenName = state.chosen || 'Am7';
    const chosen = all.find((chord) => chord.name === chosenName) || all[0];
    const noteName = (midi) => names[midi % 12];
    const rows = filtered.slice(0, 40).map((chord) => ({
      name: chord.name, notes: chord.intervals.map((step) => noteName(chord.root + step)).join(' '),
      cls: chord.name === chosen.name ? 'crow crow-sel' : 'crow', pick: () => this.setState({ chosen: chord.name })
    }));
    const base = 48 + chosen.root;
    const rootVoicing = chosen.intervals.map((step) => base + step);
    const invert = (voicing) => voicing.slice(1).concat(voicing[0] + 12);
    const first = invert(rootVoicing);
    const second = invert(first);
    const keyboard = (voicing) => {
      const whites = [];
      const blacks = [];
      const blackOffsets = { 1: -1, 3: 1, 6: -1, 8: 0, 10: 1 };
      let white = 0;
      for (let midi = 48; midi < 84; midi++) {
        const on = voicing.includes(midi);
        if ((midi % 12) in blackOffsets) blacks.push({ left: white * 12 - 4 + blackOffsets[midi % 12], cls: on ? 'mb mb-on' : 'mb' });
        else { whites.push({ left: white * 12, cls: on ? 'mw mw-on' : 'mw' }); white++; }
      }
      return { whites, blacks };
    };
    const voicings = [['Root position', rootVoicing], ['1st inversion', first], ['2nd inversion', second]].map(([title, voicing]) => ({ title, notes: voicing.map(noteName).join(' – '), ...keyboard(voicing) }));
    return {
      rows, voicings, query: state.query || '',
      chordName: chosen.name, chordNotes: chosen.intervals.map((step) => noteName(chosen.root + step)).join(' · '),
      typed: (event) => this.setState({ query: event.target.value }),
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
