<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dust particles prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#c8cacd}a:hover{color:#ffffff}
.silk{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd}
.silk-dim{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:#a3a5aa}
.seg{height:26px;padding:0 12px;border:1px solid #111214;background:linear-gradient(#3d3e42,#2c2d30);color:#c8cacd;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px}
.led{width:6px;height:6px;border-radius:50%;background:#4a2a24;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.led-on{background:#ff5a36;box-shadow:0 0 4px rgba(255,90,54,.7)}
.wk{position:absolute;top:0;width:22px;height:140px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#e9e6de 0,#f8f7f2 12%,#fbfaf6 80%,#efece4 100%);box-shadow:inset 0 -6px 0 #d8d3c6,inset -1px 0 0 rgba(0,0,0,.10)}
.wk.down{background:linear-gradient(180deg,#cfcbc1 0,#e6e3da 14%,#eeebe3 85%,#e4e0d6 100%);box-shadow:inset 0 -3px 0 #cfc9bb,inset 0 5px 6px -3px rgba(0,0,0,.35),inset -1px 0 0 rgba(0,0,0,.14)}
.bk{position:absolute;top:0;width:14px;height:88px;border-radius:0 0 2px 2px;background:linear-gradient(180deg,#141415 0,#1e1e20 82%,#3b3b3f 84%,#2a2a2d 100%);box-shadow:inset 1px 0 0 #2c2c2f,inset -1px 0 0 #070707,1px 3px 4px rgba(0,0,0,.45)}
.bk.down{background:linear-gradient(180deg,#0e0e0f 0,#18181a 88%,#2c2c2f 90%,#222225 100%)}
</style>
</helmet>
<div style="width:1200px;height:645px;position:relative;overflow:hidden;background:#050506">
  <div style="height:36px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:12px;background:#232427;border-bottom:1px solid #0b0b0c">
    <span class="silk">Dust prototype</span>
    <span class="silk-dim">plays C · Am · F · G by itself</span>
    <div style="flex-grow:1"></div>
    <button class="seg" aria-label="Show the dust the app has today" onClick="{{showCurrent}}"><span class="{{currentLed}}" aria-hidden="true"></span>Current app dust</button>
    <button class="seg" aria-label="Show the new smooth dust" onClick="{{showNew}}"><span class="{{newLed}}" aria-hidden="true"></span>New smooth dust</button>
  </div>
  <canvas ref="{{setCanvas}}" style="display:block;width:1200px;height:465px" aria-label="Animated dust rising from the played keys" role="img"></canvas>
  <div style="height:4px;background:linear-gradient(#5e1a1d,#43121a)"></div>
  <div style="position:relative;height:140px;background:#0b0b0c;overflow:hidden">
    <sc-for list="{{whites}}" as="w" hint-placeholder-count="52"><div class="{{w.cls}}" style="left:{{w.left}}px"></div></sc-for>
    <sc-for list="{{blacks}}" as="b" hint-placeholder-count="36"><div class="{{b.cls}}" style="left:{{b.left}}px"></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"colour":{"editor":"color","default":"#ffe2b0","options":["#ffe2b0","#bfe8ff","#ffb4d2","#c8ffcf"]},"density":{"editor":"range","min":0.3,"max":2,"step":0.1,"default":1},"$preview":{"width":1200,"height":645}}'>
class Component extends DCLogic {
  static width() { return 1200; }
  static height() { return 465; }
  static chords() { return [[48, 60, 64, 67, 76], [45, 60, 64, 69, 72], [41, 60, 65, 69, 77], [43, 59, 62, 67, 74]]; }

  keys() {
    if (this.keyCache) return this.keyCache;
    const whiteWidth = Component.width() / 52;
    const blackOffsets = { 1: -2, 3: 2, 6: -2, 8: 0, 10: 2 };
    const keys = {};
    let white = 0;
    for (let midi = 21; midi <= 108; midi++) {
      const pitchClass = midi % 12;
      if (pitchClass in blackOffsets) {
        const left = white * whiteWidth - 7 + blackOffsets[pitchClass];
        keys[midi] = { black: true, left, width: 14, centre: left + 7 };
      } else {
        keys[midi] = { black: false, left: white * whiteWidth, width: whiteWidth, centre: white * whiteWidth + whiteWidth / 2 };
        white++;
      }
    }
    this.keyCache = keys;
    return keys;
  }

  smooth(edgeLow, edgeHigh, value) {
    const t = Math.min(1, Math.max(0, (value - edgeLow) / (edgeHigh - edgeLow)));
    return t * t * (3 - 2 * t);
  }

  componentDidMount() {
    this.particles = [];
    this.held = [];
    this.clock = 0;
    this.time = 0;
    this.sprites = {};
    this.last = performance.now();
    const loop = (now) => {
      this.frame = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      this.step(dt);
    };
    this.frame = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.frame);
  }

  mode() {
    return (this.state && this.state.mode) || 'new';
  }

  sprite(colour) {
    if (this.sprites[colour]) return this.sprites[colour];
    const size = 64;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.18, colour);
    gradient.addColorStop(0.45, colour + '66');
    gradient.addColorStop(1, colour + '00');
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    this.sprites[colour] = canvas;
    return canvas;
  }

  noteOn(midi) {
    const key = this.keys()[midi];
    if (!key) return;
    if (this.mode() === 'current') {
      for (let index = 0; index < 40; index++) {
        this.particles.push({
          kind: 'current', x: key.centre + (Math.random() - 0.5) * 48, y: Component.height() - 12 + (Math.random() - 0.5) * 4.6,
          vx: (Math.random() - 0.5) * 120, vy: -(23 + Math.random() * 93), size: 1.5 + Math.random() * 7.5,
          alpha: 0.4 + Math.random() * 0.6, life: 0.8 + Math.random() * 0.4
        });
      }
      return;
    }
    const density = this.props.density ?? 1;
    for (let index = 0; index < 26 * density; index++) this.emit(key, 1.8);
  }

  emit(key, push) {
    const mote = Math.random() < 0.14;
    this.particles.push({
      kind: mote ? 'mote' : 'speck',
      x: key.centre + (Math.random() - 0.5) * key.width * 0.9, y: Component.height() - 1,
      vx: (Math.random() - 0.5) * 26, vy: -(14 + Math.random() * 30) * push,
      age: 0, life: mote ? 1.8 + Math.random() * 1.4 : 2.2 + Math.random() * 1.8,
      sizeStart: mote ? 5 + Math.random() * 4 : 0.7 + Math.random() * 1.1,
      sizeEnd: mote ? 11 + Math.random() * 8 : 1.4 + Math.random() * 1.6,
      alpha: mote ? 0.05 + Math.random() * 0.06 : 0.45 + Math.random() * 0.45,
      seed: Math.random() * 100
    });
  }

  step(dt) {
    const canvas = this.canvas;
    if (!canvas) return;
    const ratio = window.devicePixelRatio || 1;
    if (canvas.width !== Component.width() * ratio) {
      canvas.width = Component.width() * ratio;
      canvas.height = Component.height() * ratio;
    }
    this.time += dt;
    this.clock += dt;
    const cycle = 1.6;
    const chordIndex = Math.floor(this.clock / cycle) % Component.chords().length;
    const held = (this.clock % cycle) < 1.3 ? Component.chords()[chordIndex] : [];
    const started = held.filter((midi) => !this.held.includes(midi));
    if (started.length || held.length !== this.held.length) {
      started.forEach((midi) => this.noteOn(midi));
      this.held = held;
      this.setState({ pressed: held });
    }
    const density = this.props.density ?? 1;
    if (this.mode() === 'new') {
      held.forEach((midi) => {
        const key = this.keys()[midi];
        const expected = 60 * density * dt;
        let count = Math.floor(expected) + (Math.random() < expected % 1 ? 1 : 0);
        while (count-- > 0) this.emit(key, 1);
      });
    }
    if (this.particles.length > 3200) this.particles.splice(0, this.particles.length - 3200);

    const context = canvas.getContext('2d');
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, Component.width(), Component.height());
    const chosen = this.props.colour ?? '#ffe2b0';
    const colour = /^#[0-9a-fA-F]{6}$/.test(chosen) ? chosen : '#ffe2b0';
    const sprite = this.sprite(colour);
    const time = this.time;
    const alive = [];

    if (this.mode() === 'current') {
      context.globalCompositeOperation = 'source-over';
      for (const particle of this.particles) {
        if (particle.kind !== 'current') continue;
        particle.vx += (Math.random() - 0.5) * 0.5 * dt * 600;
        particle.vx *= Math.pow(0.95, dt * 60);
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.life -= dt * 0.6;
        if (particle.life <= 0) continue;
        alive.push(particle);
        context.globalAlpha = Math.min(1, particle.alpha * particle.life);
        const radius = particle.size;
        context.drawImage(sprite, particle.x - radius, particle.y - radius, radius * 2, radius * 2);
      }
    } else {
      context.globalCompositeOperation = 'lighter';
      const damping = Math.exp(-1.4 * dt);
      for (const particle of this.particles) {
        if (particle.kind === 'current') continue;
        particle.age += dt;
        const progress = particle.age / particle.life;
        if (progress >= 1) continue;
        const flowX = Math.sin(particle.y * 0.011 + time * 0.55 + particle.seed * 0.02) * 0.65 + Math.sin(particle.y * 0.029 - time * 0.9 + particle.x * 0.004) * 0.35;
        const flowY = Math.cos(particle.x * 0.009 - time * 0.45) * 0.5 + Math.cos(particle.x * 0.023 + particle.y * 0.006 + time * 0.8) * 0.3;
        particle.vx = particle.vx * damping + flowX * 22 * dt;
        particle.vy = particle.vy * damping + (flowY * 9 - 16 * (1 - progress)) * dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        alive.push(particle);
        const fade = this.smooth(0, 0.12, progress) * (1 - this.smooth(0.3, 1, progress));
        const grow = 1 - Math.pow(1 - progress, 2);
        const radius = (particle.sizeStart + (particle.sizeEnd - particle.sizeStart) * grow) * (particle.kind === 'mote' ? 1 : 2.2);
        context.globalAlpha = particle.alpha * fade;
        context.drawImage(sprite, particle.x - radius, particle.y - radius, radius * 2, radius * 2);
      }
    }
    this.particles = alive;
    context.globalAlpha = 1;
    context.globalCompositeOperation = 'source-over';
  }

  renderVals() {
    if (!this.setCanvas) this.setCanvas = (element) => { this.canvas = element; };
    const pressed = (this.state && this.state.pressed) || [];
    const whites = [];
    const blacks = [];
    for (let midi = 21; midi <= 108; midi++) {
      const key = this.keys()[midi];
      const down = pressed.includes(midi);
      if (key.black) blacks.push({ left: Math.round(key.left * 100) / 100, cls: down ? 'bk down' : 'bk' });
      else whites.push({ left: Math.round(key.left * 100) / 100, cls: down ? 'wk down' : 'wk' });
    }
    const mode = this.mode();
    return {
      setCanvas: this.setCanvas,
      whites, blacks,
      currentLed: mode === 'current' ? 'led led-on' : 'led',
      newLed: mode === 'new' ? 'led led-on' : 'led',
      showCurrent: () => { this.particles = []; this.setState({ mode: 'current' }); },
      showNew: () => { this.particles = []; this.setState({ mode: 'new' }); }
    };
  }
}
</script>
</body>
</html>
