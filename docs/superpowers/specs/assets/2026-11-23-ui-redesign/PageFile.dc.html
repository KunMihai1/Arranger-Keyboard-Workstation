<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recorder and MIDI files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#c8cacd}a:hover{color:#ffffff}
.silk{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd;white-space:nowrap}
.silk-dim{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;color:#a3a5aa}
.rule{height:1px;background:#4a4c51}
.seg{height:26px;padding:0 12px;border:1px solid #111214;background:linear-gradient(#3d3e42,#2c2d30);color:#c8cacd;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg-lit{background:linear-gradient(#56463a,#3f3127);color:#ffe2cf;border-color:#2a1d14}
.led{width:6px;height:6px;border-radius:50%;background:#4a2a24}
.led-on{background:#ff5a36;box-shadow:0 0 4px rgba(255,90,54,.7)}
.lcd{background:#a7b394;border-radius:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);font-family:'Share Tech Mono',monospace;color:#1b2216}
</style>
</helmet>
<div style="width:1200px;height:365px;box-sizing:border-box;padding:16px 28px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(#26272a,#212225)">
  <div style="display:flex;align-items:center;gap:12px">
    <span class="silk" style="font-size:14px;letter-spacing:.2em">Recorder</span>
    <div class="rule" style="flex-grow:1"></div>
    <button class="seg" aria-label="Close recorder" onClick="{{close}}">Exit</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span class="silk">Your last recording</span><div class="rule" style="flex-grow:1"></div></div>
      <div class="lcd" style="padding:12px 16px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:12px"><span>LAST RECORDING</span><span>● REC OFF</span></div>
        <div style="font-size:44px;line-height:1">00:42</div>
        <div style="font-size:13px">312 events</div>
      </div>
      <div style="display:flex;gap:8px"><button class="seg seg-lit"><span class="led led-on" aria-hidden="true"></span>Play recording</button><button class="seg">Stop</button><button class="seg">Save as MIDI…</button></div>
      <span class="silk-dim">Press REC on the panel to start and stop recording.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span class="silk">MIDI file</span><div class="rule" style="flex-grow:1"></div></div>
      <div class="lcd" style="padding:12px 16px;display:flex;flex-direction:column;gap:6px">
        <div style="font-size:12px">NO FILE LOADED</div>
        <div style="font-size:16px">Choose a .mid file to play it</div>
        <div style="font-size:13px">through the current sounds</div>
      </div>
      <div style="display:flex;gap:8px"><button class="seg seg-lit">Play a MIDI file…</button><button class="seg">Stop</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":1200,"height":365}}'>
class Component extends DCLogic {
  renderVals() {
    return { close: () => { if (this.props.onClose) this.props.onClose(); } };
  }
}
</script>
</body>
</html>
