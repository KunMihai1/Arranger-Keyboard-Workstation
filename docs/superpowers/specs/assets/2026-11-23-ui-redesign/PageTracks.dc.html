<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track picker: folders and tracks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#c8cacd}a:hover{color:#ffffff}
.silk{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8cacd;white-space:nowrap}
.silk-dim{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a3a5aa;white-space:nowrap}
.rule{height:1px;background:#4a4c51}
.seg{height:22px;padding:0 10px;border:1px solid #111214;background:linear-gradient(#3d3e42,#2c2d30);color:#c8cacd;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg-lit{background:linear-gradient(#56463a,#3f3127);color:#ffe2cf;border-color:#2a1d14}
.led{width:5px;height:5px;border-radius:50%;background:#4a2a24}
.led-on{background:#ff5a36;box-shadow:0 0 3px rgba(255,90,54,.7)}
.lcd{background:#a7b394;border-radius:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);font-family:'Share Tech Mono',monospace;color:#1b2216}
.row{display:flex;align-items:center;gap:10px;width:100%;height:24px;padding:0 10px;box-sizing:border-box;border:none;background:none;font-family:'Share Tech Mono',monospace;font-size:14px;color:#1b2216;text-align:left;cursor:pointer}
.row-sel{background:#1b2216;color:#a7b394}
.glyph{width:14px;height:10px;position:relative;flex-shrink:0}
.folder-glyph{border:1.5px solid currentColor;border-radius:1px;box-sizing:border-box}
.folder-glyph::before{content:'';position:absolute;left:-1.5px;top:-4px;width:6px;height:3px;border:1.5px solid currentColor;border-bottom:none;border-radius:1px 1px 0 0}
.note-glyph{width:8px;height:8px;border-radius:50%;background:currentColor;margin:0 3px}
.detail{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(27,34,22,.3)}
</style>
</helmet>
<div style="width:1200px;height:365px;box-sizing:border-box;padding:16px 28px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#26272a,#212225)">
  <div style="display:flex;align-items:center;gap:12px">
    <span class="silk" style="font-size:14px;letter-spacing:.2em">Choose track · slot 3</span>
    <div class="rule" style="flex-grow:1"></div>
    <span class="silk-dim">Sort</span>
    <button class="seg" onClick="{{cycleSort}}" aria-label="Change sort order">{{sortLabel}} ◂ ▸</button>
    <button class="seg" aria-label="Close track picker" onClick="{{close}}">Exit</button>
  </div>
  <div style="display:flex;gap:22px;flex-grow:1;min-height:0">
    <div style="width:620px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px">
        <sc-if value="{{inFolder}}" hint-placeholder-val="{{false}}"><button class="seg" onClick="{{back}}" aria-label="Back to folders">◂ Back</button></sc-if>
        <span class="silk">{{path}}</span>
        <div class="rule" style="flex-grow:1"></div>
        <span class="silk-dim">Double-click to {{doubleAction}}</span>
      </div>
      <div class="lcd" style="flex-grow:1;padding:4px 0;overflow:hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <button class="{{r.cls}}" onClick="{{r.pick}}" onDoubleClick="{{r.open}}" aria-label="{{r.name}}">
            <span class="{{r.glyph}}" aria-hidden="true"></span>
            <span style="flex-grow:1">{{r.name}}</span>
            <span>{{r.right}}</span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px"><span class="silk">{{detailTitle}}</span><div class="rule" style="flex-grow:1"></div></div>
      <div class="lcd" style="padding:6px 12px">
        <sc-for list="{{details}}" as="d" hint-placeholder-count="4"><div class="detail"><span>{{d.label}}</span><span>{{d.value}}</span></div></sc-for>
      </div>
      <sc-if value="{{inFolder}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="seg seg-lit" style="height:30px;justify-content:center;font-size:12px" aria-label="Use this track in slot 3">Use in slot 3</button>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="seg">Add from MIDI file…</button><button class="seg">Rename…</button><button class="seg">Remove</button></div>
        </div>
      </sc-if>
      <sc-if value="{{inFolders}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="seg seg-lit" style="height:30px;justify-content:center;font-size:12px" onClick="{{openSelected}}" aria-label="Open folder">Open folder</button>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="seg">Add folder…</button><button class="seg">Rename…</button><button class="seg">Remove</button></div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":1200,"height":365}}'>
class Component extends DCLogic {
  library() {
    return [
      { name: 'Ballads', modified: 3, tracks: [['Soft brush kit', 'Brush Kit', 'percussion'], ['Fretless line', 'Fretless Bass', 'melodic'], ['Ballad piano arp', 'Grand Piano', 'melodic'], ['Pad swell', 'Warm Pad', 'melodic'], ['Strings legato', 'Warm Strings', 'melodic']] },
      { name: 'Pop 8-beat', modified: 1, tracks: [['8-beat kit', 'Standard Kit', 'percussion'], ['Pick bass', 'Pick Bass', 'melodic'], ['Muted guitar', 'Clean Guitar', 'melodic'], ['E.Piano comp', 'Electric Piano', 'melodic']] },
      { name: 'Latin', modified: 5, tracks: [['Bossa kit', 'Standard Kit', 'percussion'], ['Nylon comp', 'Nylon Guitar', 'melodic'], ['Upright walk', 'Acoustic Bass', 'melodic']] },
      { name: 'My recordings', modified: 0, tracks: [['Recording 1', 'Grand Piano', 'melodic'], ['Recording 2', 'Organ', 'melodic']] }
    ];
  }

  renderVals() {
    const state = this.state || {};
    const library = this.library();
    const sorts = ['Name', 'Newest', 'Oldest'];
    const sort = state.sort || 0;
    const folderIndex = state.folder;
    const inFolder = folderIndex !== undefined && folderIndex !== null;
    const selected = state.selected || 0;
    const select = (index) => () => this.setState({ selected: index });
    const close = () => { if (this.props.onClose) this.props.onClose(); };
    let folders = library.map((folder, index) => ({ ...folder, index }));
    if (sort === 0) folders.sort((a, b) => a.name.localeCompare(b.name));
    if (sort === 1) folders.sort((a, b) => a.modified - b.modified);
    if (sort === 2) folders.sort((a, b) => b.modified - a.modified);
    let rows;
    let details;
    if (!inFolder) {
      rows = folders.map((folder, position) => ({
        name: folder.name, right: folder.tracks.length + ' tracks', glyph: 'glyph folder-glyph',
        cls: position === selected ? 'row row-sel' : 'row', pick: select(position),
        open: () => this.setState({ folder: folder.index, selected: 0 })
      }));
      const current = folders[Math.min(selected, folders.length - 1)];
      details = [{ label: 'Folder', value: current.name }, { label: 'Tracks', value: String(current.tracks.length) }, { label: 'Melodic', value: String(current.tracks.filter((track) => track[2] === 'melodic').length) }, { label: 'Percussion', value: String(current.tracks.filter((track) => track[2] === 'percussion').length) }];
    } else {
      const folder = library[folderIndex];
      const tracks = folder.tracks.map(([name, instrument, type]) => ({ name, instrument, type }));
      if (sort === 0) tracks.sort((a, b) => a.name.localeCompare(b.name));
      rows = tracks.map((track, position) => ({
        name: track.name + '  (' + track.instrument + ')', right: track.type === 'percussion' ? 'PERC' : 'MEL', glyph: 'glyph note-glyph',
        cls: position === selected ? 'row row-sel' : 'row', pick: select(position), open: () => {}
      }));
      const current = tracks[Math.min(selected, tracks.length - 1)];
      details = [{ label: 'Track', value: current.name }, { label: 'Instrument', value: current.instrument }, { label: 'Type', value: current.type }, { label: 'Folder', value: folder.name }];
    }
    return {
      rows, details, inFolder, inFolders: !inFolder, close,
      path: inFolder ? 'Folders › ' + library[folderIndex].name : 'Folders',
      doubleAction: inFolder ? 'use the track' : 'open',
      detailTitle: inFolder ? 'Track' : 'Folder',
      sortLabel: sorts[sort],
      cycleSort: () => this.setState({ sort: (sort + 1) % sorts.length, selected: 0 }),
      back: () => this.setState({ folder: null, selected: 0 }),
      openSelected: () => { const current = folders[Math.min(selected, folders.length - 1)]; this.setState({ folder: current.index, selected: 0 }); }
    };
  }
}
</script>
</body>
</html>
